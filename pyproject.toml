[project]
name = "actoris_harena"
version = "0.2"
description = "Bimanual manipulation research environment."
requires-python = ">=3.8"

authors = [
    { name = "Halid Abdulrahim Kadi", email = "halidkadi.robot@gmail.com" }
]

readme = "README.md"

dependencies = [
    "numpy<2.0",
    "pybind11>=2.12.0",
    "ruamel.yaml>=0.17.40",
    "seaborn>=0.13.0",
    "dotmap>=1.3.30",
    "h5py>=3.8.0",
    "tqdm>=4.60.0",
    "opencv-python>=4.8.0",
    "imutils>=0.5.4",
    "matplotlib>=3.7.0",
    "moviepy>=1.0.3",
    "scikit-image>=0.21.0",
    "tensorboard>=2.14.0",
    "termcolor>=2.3.0",
    "kornia>=0.6.0",
    "pandas>=2.0.0",
    "charset-normalizer>=3.3.0",
    "pyquaternion>=0.9.9",
    "shapely>=2.0.0",
    "scikit-learn>=1.3.0",
    "pyswarm>=0.6",
    "wandb>=0.15.0",
    "transformations==2020.1.1",
    "pybullet>=3.2.0",
    "circle-fit",
    "dm_control>=1.0.14",
    
    "tensorboardX>=2.6.0",
    "psutil>=5.9.0",
    "transforms3d>=0.4.1",
    "einops>=0.7.0",
    "meshcat>=0.3.2",
    "multipledispatch>=1.0.0",
    "sk-video>=1.1.10",
    "zarr>=2.16.0",
    "open3d>=0.17.0",
    "ray>=2.0.0",
    "pygame>=2.5.0",
    "pymunk>=6.5.0",
    "gdown>=5.1.0",
    "scipy>=1.10.0",
    "ur-rtde",
    "pyrealsense2",
    "omegaconf>=2.3.0", 
    "hydra-core>=1.3.2",  
    "robosuite>=1.4.1",
    "gymnasium<=0.29.1",          # <-- CRITICAL for Python 3.8
    "gymnasium-robotics<=1.3.1",  # <-- CRITICAL for Python 3.8
    "openai>=1.0.0"
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",               # Relaxed for Python 3.8 fallback
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "diffusers>=0.20.0",
    "transformers>=4.30.0",
    "accelerate>=0.25.0"
]

# Run `pip install "pip<24.1" setuptools==65.5.0 wheel==0.38.4` before running this block of instalation.
diffskill = [
    "cmake==3.24.0",
    "gym==0.21.0",
    "torch==1.9.0",               # Strict original paper version
    "torchvision==0.10.0",
    "torchaudio==0.9.0",
    "taichi==0.7.26",
    "pykeops==1.5",
    "kornia<=0.6.8",
    "geomloss",
    "yacs",
    "natsort"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["actoris_harena*"]